name: Deploy 4mica Dashboard

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  scan:
    uses: ./.github/workflows/dependency-scan.yml
    with:
      filters: '["@4mica/dashboard..."]'

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy dashboard with Docker Compose
        uses: ./.github/actions/remote-deploy
        with:
          server_host: ${{ secrets.DASHBOARD_SERVER_HOST }}
          server_user: ${{ vars.SERVER_USER || 'mo' }}
          ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}
          deploy_path: ${{ vars.DEPLOY_PATH || '~/var/www/4mica' }}
          branch: ${{ inputs.environment == 'dev' && 'dev' || 'main' }}
          repo_ssh_url: git@github.com:${{ github.repository }}.git
          service_dir: apps/dashboard
          health_container: 4mica-dashboard
          # Every VITE_* value here is a build arg, inlined into the bundle by
          # Vite. Changing one needs a rebuild, which `up -d --build` does.
          # The Clerk publishable key ships in the browser bundle, so it is a
          # variable, not a secret.
          env_contents: |
            DASHBOARD_PORT=${{ vars.DASHBOARD_PORT || '8082' }}

            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_BASE_URL=${{ vars.VITE_BASE_URL }}
            VITE_APP_URL=${{ vars.VITE_APP_URL }}
            VITE_SENTRY_DSN=${{ vars.DASHBOARD_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=${{ inputs.environment }}

      - name: Confirm HTTPS redirect and HSTS
        shell: bash
        env:
          APP_URL: ${{ vars.VITE_APP_URL || 'https://app.4mica.io' }}
          API_URL: ${{ vars.VITE_API_URL || 'https://api.app.4mica.io' }}
        run: |
          hosts=()
          for url in "$APP_URL" "$API_URL"; do
            host="${url#*://}"
            hosts+=("${host%%/*}")
          done
          bash infra/nginx/probe-tls.sh "${hosts[@]}"
