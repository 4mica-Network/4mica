name: Deploy 4mica Website

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/url/**"
      - "packages/tailwind-config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/actions/remote-deploy/**"
      - ".github/workflows/build-react-app.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy web with Docker Compose
        uses: ./.github/actions/remote-deploy
        with:
          server_host: ${{ secrets.SERVER_HOST }}
          server_user: ${{ vars.SERVER_USER || 'mo' }}
          ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}
          deploy_path: ${{ vars.DEPLOY_PATH || '~/var/www/4mica' }}
          branch: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev') && 'dev' || 'main' }}
          repo_ssh_url: git@github.com:${{ github.repository }}.git
          service_dir: apps/web
          health_container: 4mica-web
          pre_up: docker network create 4mica-edge 2>/dev/null || true
          env_contents: |
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            WEB_PORT=${{ vars.WEB_PORT || '8080' }}
