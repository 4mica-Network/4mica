name: Deploy 4mica Website

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - prod

# Deliberately NOT the `deploy-<env>` group the other four workflows share.
# That group exists to stop concurrent `git pull`s against one checkout; this
# workflow is the only one targeting Box A and has a checkout of its own (see
# deploy_path below), so sharing it would only make web queue behind Box B.
concurrency:
  group: deploy-web-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy web with Docker Compose
        uses: ./.github/actions/remote-deploy
        with:
          server_host: ${{ secrets.SERVER_HOST }}
          server_user: ${{ vars.WEB_SERVER_USER || vars.SERVER_USER || 'mo' }}
          ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}
          deploy_path: ${{ vars.WEB_DEPLOY_PATH || '~/var/www/4mica' }}
          branch: ${{ inputs.environment == 'dev' && 'dev' || 'main' }}
          repo_ssh_url: git@github.com:${{ github.repository }}.git
          service_dir: apps/web
          health_container: 4mica-web
          pre_up: |
            docker network create 4mica-edge 2>/dev/null || true
            # The edge proxies the entire bare-handle namespace with
            # `proxy_pass $mica_playground`, and nginx does not validate a `set`
            # variable at startup. A value with no scheme therefore parses fine,
            # the container starts healthy, and every playground request then
            # fails with `invalid URL prefix` — a bare 500 for /sign-in, /api/
            # and every profile, while the marketing routes stay green. Compose
            # already refuses an empty value; this catches the malformed one.
            # Checked here rather than warned about later because the edge this
            # deploy is about to start would be broken for half the apex.
            upstream="$(sed -n 's/^PLAYGROUND_UPSTREAM=//p' .env | tail -1)"
            case "$upstream" in
              http://*|https://*) ;;
              "")
                echo "::error::PLAYGROUND_UPSTREAM is empty. Set the variable to the address apps/playground is reachable at from this box, e.g. http://10.0.0.5:8081."
                exit 1 ;;
              *)
                echo "::error::PLAYGROUND_UPSTREAM has no http:// or https:// scheme. nginx needs one to proxy_pass; without it the edge answers 500 for the whole handle namespace. Re-enter the variable as e.g. http://10.0.0.5:8081."
                exit 1 ;;
            esac
          post_up: |
            EDGE_PORT="$(sed -n 's/^EDGE_PORT=//p' .env | tail -1)"
            EDGE_PORT="${EDGE_PORT:-8088}"
            if ! curl -sfo /dev/null -H 'Host: 4mica.io' \
                 "http://127.0.0.1:${EDGE_PORT}/"; then
              echo "::warning::edge container is not answering on 127.0.0.1:${EDGE_PORT}."
            fi
            # `/` above is `location = /`, which is apps/web — it says nothing
            # about the other half of the apex. /api/health is apps/playground's
            # own healthcheck endpoint and is unambiguously routed to it, so
            # this is the probe that catches a broken PLAYGROUND_UPSTREAM, a
            # stopped playground, or a firewall between the boxes. A warning,
            # not a failure: apps/playground runs on the other box and is not
            # this deploy's to fix.
            if ! curl -sfo /dev/null -H 'Host: 4mica.io' \
                 "http://127.0.0.1:${EDGE_PORT}/api/health"; then
              echo "::warning::The edge cannot reach apps/playground. The bare-handle namespace, /sign-in and /api are down even though apps/web is fine. Check PLAYGROUND_UPSTREAM in apps/web/.env on this box, and that 4mica-playground is up on the apps/be box."
            fi
            # No -L: after certbot this is a 301 to https, which is correct and
            # which `curl -f` treats as success (it only fails on 4xx/5xx).
            if ! curl -sfo /dev/null -H 'Host: 4mica.io' http://127.0.0.1/; then
              echo "::warning::Host nginx is not serving 4mica.io on :80. Run 'sudo infra/nginx/install.sh a' on this box."
            fi
            bash ../../infra/nginx/install.sh --check a \
              || echo "::warning::Host nginx config drifted from infra/nginx (see above). Expected if certbot has run; otherwise run 'sudo infra/nginx/install.sh a'."
          env_contents: |
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            WEB_PORT=${{ vars.WEB_PORT || '8080' }}

            # This box serves 4mica.io, so it runs the `edge` nginx that splits
            # the apex between apps/web and apps/playground. EDGE_PORT is what
            # infra/nginx/4mica.io.conf proxies to.
            EDGE_PORT=${{ vars.EDGE_PORT || '8088' }}
            # apps/playground runs on the apps/be box, so this is an address
            # reachable from here — e.g. http://10.0.0.5:8081, matching that
            # box's PLAYGROUND_BIND and PLAYGROUND_PORT. Required: `edge`
            # refuses to start without it rather than serving a broken apex.
            PLAYGROUND_UPSTREAM=${{ vars.PLAYGROUND_UPSTREAM }}
