name: Facilitator CI

on:
  pull_request:
    paths:
      - "apps/facilitator/**"
      - "packages/sdk/**"
      - "packages/sdk-python/**"
      - ".github/workflows/facilitator-ci.yml"
  workflow_dispatch:

jobs:
  build:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/facilitator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo test
        run: cargo test --all-features

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @4mica/x402 consumes the workspace SDK; build it before typechecking
      # or testing anything that imports its declarations.
      - name: Build workspace SDK
        run: pnpm --filter @4mica/sdk build

      - name: Lint
        run: pnpm --filter "./apps/facilitator/**" run lint

      - name: Format check
        run: pnpm --filter "./apps/facilitator/**" run fmt

      - name: Test
        run: pnpm --filter "./apps/facilitator/**" run test

      - name: Build
        run: pnpm --filter "./apps/facilitator/**" run build

  python:
    name: Python (4mica-x402)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/facilitator/packages/python/x402
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          uv venv
          uv pip install -e ../../../../../packages/sdk-python
          uv pip install -e ".[dev,fastapi,flask,httpx]"

      - name: Ruff lint
        run: uv run ruff check src tests demo

      - name: Pytest
        run: uv run pytest
