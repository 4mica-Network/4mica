name: Release SDK

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # What is published is scanned first: the CLI holds wallet keys, and the
  # SDK signs with them.
  scan:
    name: Dependency scan
    uses: ./.github/workflows/dependency-scan.yml
    with:
      filters: '["@4mica/cli...","@4mica/sdk...","@4mica/x402..."]'

  release:
    name: Version & publish @4mica/sdk*
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Only the packages this workflow publishes. The apps need runtime secrets
      # (DATABASE_URL and friends) to build and are deployed by their own workflows.
      - name: Build
        run: pnpm turbo run build --filter='@4mica/sdk*' --filter=@4mica/cli --filter=@4mica/x402

      - name: CLI snapshot is current
        run: git diff --exit-code -- packages/cli/snapshot.json

      # Same scope: turbo schedules `build` for every package in the graph when a task
      # depends on it, so an unscoped run would build the apps again.
      - name: Verify package exports
        run: pnpm turbo run check:exports --filter='@4mica/sdk*' --filter=@4mica/cli --filter=@4mica/x402

      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: "chore(release): version @4mica/sdk packages"
          title: "chore(release): version @4mica/sdk packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Signed provenance: npm shows which commit and workflow built the
          # tarball. Needs the id-token permission above.
          NPM_CONFIG_PROVENANCE: "true"
