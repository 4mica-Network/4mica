name: Deploy 4mica Playground

on:
  push:
    branches: [main]
    paths:
      - "apps/playground/**"
      - "packages/db/**"
      - "packages/ui/**"
      - "packages/url/**"
      - "packages/tailwind-config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/actions/remote-deploy/**"
      - ".github/workflows/deploy-playground.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - prod

concurrency:
  # Shares a server (and the 4mica-edge network) with the web deploy, so this
  # must not run concurrently with itself.
  group: deploy-playground-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy playground with Docker Compose
        uses: ./.github/actions/remote-deploy
        with:
          # Co-located with apps/web: the edge nginx in this stack fronts both.
          server_host: ${{ secrets.SERVER_HOST }}
          server_user: ${{ vars.SERVER_USER || 'mo' }}
          ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}
          deploy_path: ${{ vars.DEPLOY_PATH || '~/var/www/4mica' }}
          branch: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev') && 'dev' || 'main' }}
          repo_ssh_url: git@github.com:${{ github.repository }}.git
          service_dir: apps/playground
          health_container: 4mica-playground
          # Idempotent: either stack may come up first, and the network is
          # declared `external: true` in both compose files.
          pre_up: docker network create 4mica-edge 2>/dev/null || true
          # NEXT_PUBLIC_* are build args inlined by Next; the rest are runtime.
          # NEXT_PUBLIC_ASSET_PREFIX is required in production — apps/web owns
          # the bare /_next tree on this origin.
          env_contents: |
            NODE_ENV=production
            PLAYGROUND_PORT=${{ vars.PLAYGROUND_PORT || '8081' }}
            EDGE_PORT=${{ vars.EDGE_PORT || '8088' }}
            LOG_LEVEL=${{ vars.LOG_LEVEL || 'info' }}

            DATABASE_URL=${{ secrets.DATABASE_URL }}

            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL || 'https://4mica.io' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://app.4mica.io' }}
            NEXT_PUBLIC_ASSET_PREFIX=${{ vars.NEXT_PUBLIC_ASSET_PREFIX || '/p' }}

            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}

            REVALIDATE_SECRET=${{ secrets.REVALIDATE_SECRET }}
