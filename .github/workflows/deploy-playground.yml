name: Deploy 4mica Playground

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy playground with Docker Compose
        uses: ./.github/actions/remote-deploy
        with:
          server_host: ${{ secrets.SERVER_HOST }}
          server_user: ${{ vars.SERVER_USER || 'mo' }}
          ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}
          deploy_path: ${{ vars.DEPLOY_PATH || '~/var/www/4mica' }}
          branch: ${{ inputs.environment == 'dev' && 'dev' || 'main' }}
          repo_ssh_url: git@github.com:${{ github.repository }}.git
          service_dir: apps/playground
          health_container: 4mica-playground
          pre_up: |
            docker network create 4mica-edge 2>/dev/null || true
            docker network create 4mica-data 2>/dev/null || true
            # Same attach as deploy-be.yml — either stack may come up first.
            pg='${{ vars.POSTGRES_HOST }}'
            if [ -n "$pg" ] && [ "$pg" != host.docker.internal ]; then
              docker network connect 4mica-data "$pg" 2>/dev/null || true
            fi
          env_contents: |
            NODE_ENV=production
            PLAYGROUND_PORT=${{ vars.PLAYGROUND_PORT || '8081' }}
            EDGE_PORT=${{ vars.EDGE_PORT || '8088' }}
            LOG_LEVEL=${{ vars.LOG_LEVEL || 'info' }}

            # Must match apps/be exactly — see the note in deploy-be.yml.
            POSTGRES_HOST=${{ vars.POSTGRES_HOST || 'host.docker.internal' }}
            POSTGRES_PORT=${{ vars.POSTGRES_PORT || '5432' }}
            POSTGRES_USER=${{ vars.POSTGRES_USER || '4mica' }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ vars.POSTGRES_DB || '4mica' }}

            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL || 'https://4mica.io' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://app.4mica.io' }}
            NEXT_PUBLIC_ASSET_PREFIX=${{ vars.NEXT_PUBLIC_ASSET_PREFIX || '/p' }}

            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}

            REVALIDATE_SECRET=${{ secrets.REVALIDATE_SECRET }}
