name: Facilitator release image

on:
  push:
    branches:
      - main
    tags:
      - "facilitator-v*"
    paths:
      - "apps/facilitator/**"
      - ".github/workflows/facilitator-release.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Build and push facilitator image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keeps publishing to the pre-monorepo image name so existing
      # deployments (compose defaults to facilitator-4mica:latest) keep working.
      # main -> :main, facilitator-v1.2.3 -> :1.2.3 and :1.2, every build -> :sha-<full sha>
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/4mica-network/facilitator-4mica
          tags: |
            type=ref,event=branch
            type=match,pattern=facilitator-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=facilitator-v(\d+\.\d+)\.\d+,group=1
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/facilitator
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
