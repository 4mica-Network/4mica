name: Python SDK Release

# Dispatch-only, like every release workflow in this repo. Publishes
# packages/sdk-python to PyPI via trusted publishing (no token secret).
on:
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          uv venv
          uv pip install ".[dev]"

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sdk-python/dist
