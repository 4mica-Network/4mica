services:
  playground:
    build:
      context: ../..
      dockerfile: apps/playground/Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://4mica.io}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.4mica.io}
        # Required. apps/web owns the bare /_next tree on this origin, so
        # without a prefix every page here loads unstyled and the server logs
        # nothing. nginx strips it back off.
        NEXT_PUBLIC_ASSET_PREFIX: ${NEXT_PUBLIC_ASSET_PREFIX:-/p}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    image: 4mica-playground:latest
    container_name: 4mica-playground
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3100
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: /app/logs
      # The same database apps/be migrates, and this app never migrates it.
      # Composed from the POSTGRES_* parts so the credentials have one source of
      # truth: set the same values here as in apps/be/.env, POSTGRES_HOST
      # included, or the two apps quietly read different databases.
      #
      # POSTGRES_HOST is resolved from inside the container, so it is never
      # `localhost` — see the note in apps/be/docker-compose.prod.yml. On a
      # laptop, point DATABASE_URL_OVERRIDE at host.docker.internal:5433 to
      # reach `pnpm db:up` instead.
      DATABASE_URL: ${DATABASE_URL_OVERRIDE:-postgresql://${POSTGRES_USER:-4mica}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-4mica}?schema=public}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    # Makes `host.docker.internal` resolve to the host on Linux, where Docker
    # does not provide it by default.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The `edge` nginx that fronts 4mica.io lives with apps/web on another box,
    # so this port has to be reachable from there rather than loopback-only.
    # PLAYGROUND_BIND defaults to 127.0.0.1 so an unset value fails closed:
    # the deploy succeeds and only the apex domain breaks, which is far better
    # than silently publishing an authenticated app on every interface. Set it
    # to this box's private-network address, never 0.0.0.0.
    ports:
      - "${PLAYGROUND_BIND:-127.0.0.1}:${PLAYGROUND_PORT:-8081}:3100"
    volumes:
      - playground-logs:/app/logs
    networks:
      - default
      - data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  playground-logs:
    name: 4mica-playground-logs

networks:
  # No 4mica-edge here. The `edge` nginx moved to apps/web on the 4mica.io box
  # and reaches this app over the network via PLAYGROUND_UPSTREAM — a Docker
  # network spans one host, so membership would buy nothing.
  #
  # The database network, shared with apps/be. When POSTGRES_HOST names a
  # container, the deploy workflows' pre_up attaches it here so this app can
  # resolve it by name; with a host Postgres the network is inert. Created out
  # of band (`docker network create 4mica-data`) since any stack may come first.
  data:
    name: 4mica-data
    external: true
