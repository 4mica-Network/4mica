services:
  playground:
    build:
      context: ../..
      dockerfile: apps/playground/Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://4mica.io}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.4mica.io}
        # Required. apps/web owns the bare /_next tree on this origin, so
        # without a prefix every page here loads unstyled and the server logs
        # nothing. nginx strips it back off.
        NEXT_PUBLIC_ASSET_PREFIX: ${NEXT_PUBLIC_ASSET_PREFIX:-/p}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    image: 4mica-playground:latest
    container_name: 4mica-playground
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3100
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: /app/logs
      # Must reach the Postgres started by apps/be. Either join that stack's
      # network (see `networks` below, the right answer for a real deploy) or
      # point this at host.docker.internal:5433 for a laptop.
      DATABASE_URL: ${DATABASE_URL}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    ports:
      - "127.0.0.1:${PLAYGROUND_PORT:-8081}:3100"
    volumes:
      - playground-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  edge:
    image: nginx:1.27-alpine
    container_name: 4mica-edge
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${EDGE_PORT:-8088}:80"
    depends_on:
      playground:
        condition: service_healthy

volumes:
  playground-logs:
    name: 4mica-playground-logs
# Uncomment to share the database network created by apps/be/docker-compose.yml
# instead of going through the host:
#
# networks:
#   default:
#     name: be_default
#     external: true
