[package]
name = "proxy-4mica"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["macros", "json"] }
chrono = { workspace = true }
entities = { package = "proxy-entities", path = "entities" }
migration = { package = "proxy-migration", path = "migration" }
dotenvy = "0.15"
envconfig = "0.11.1"
hex = "0.4"
redis = { version = "1.8.1", default-features = false, features = ["script", "tokio-comp", "connection-manager"] }
reqwest = { workspace = true, features = ["default-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11.1"
sea-orm = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
