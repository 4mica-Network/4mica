[package]
name = "facilitator-4mica"
version = "1.0.0"
edition = "2024"

[dependencies]
alloy = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["macros", "json"] }
dotenvy = "0.15"
hex = "0.4"
reqwest = { workspace = true, features = ["json", "default-tls"] }
rpc = { workspace = true }
sdk-4mica = { path = "../../packages/sdk-rust" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
x402-rs = "0.12.5"

[dev-dependencies]
serial_test = { workspace = true }
tokio = { workspace = true, features = ["net", "time"] }
tower = { version = "0.5.3", features = ["util"] }
