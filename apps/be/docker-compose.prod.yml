name: 4mica-be-prod
x-database-url: &database-url
  DATABASE_URL: postgresql://${POSTGRES_USER:-4mica}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-4mica}?schema=public

services:
  migrate:
    build:
      context: ../..
      dockerfile: apps/be/Dockerfile
      target: migrator
    image: 4mica-be-migrate:latest
    container_name: 4mica-be-migrate
    restart: "no"
    environment: *database-url
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - data

  valkey:
    image: valkey/valkey:8-alpine
    container_name: 4mica-be-valkey
    restart: unless-stopped
    stop_grace_period: 10s
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${VALKEY_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - default

  be:
    build:
      context: ../..
      dockerfile: apps/be/Dockerfile
    image: 4mica-be:latest
    container_name: 4mica-be
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    environment:
      # database than the one the migrations were applied to.
      <<: *database-url
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-5000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-20000}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_IP_MAX: ${RATE_LIMIT_IP_MAX:-300}
      RATE_LIMIT_USER_MAX: ${RATE_LIMIT_USER_MAX:-120}
      RATE_LIMIT_SENSITIVE_MAX: ${RATE_LIMIT_SENSITIVE_MAX:-10}
      RATE_LIMIT_API_KEY_MAX: ${RATE_LIMIT_API_KEY_MAX:-600}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
      EMAIL_SERVICE_URL: ${EMAIL_SERVICE_URL:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      APP_URL: ${APP_URL:-}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:-}
      ONBOARDING_TICK_MS: ${ONBOARDING_TICK_MS:-300000}
      ONBOARDING_BATCH_SIZE: ${ONBOARDING_BATCH_SIZE:-25}
      ONBOARDING_STEP_GAP_MS: ${ONBOARDING_STEP_GAP_MS:-259200000}
      ONBOARDING_DRIP_EPOCH: ${ONBOARDING_DRIP_EPOCH:-2026-09-15T00:00:00.000Z}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BE_PORT:-4000}:4000"
    networks:
      - default
      - internal
      - data
    depends_on:
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  valkey-data:
    name: 4mica-be-prod-valkey-data

networks:
  internal:
    name: 4mica-internal
    external: true
  data:
    name: 4mica-data
    external: true
