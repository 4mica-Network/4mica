#
# Production stack for apps/be: a one-shot migrate container plus the API.
#
# Postgres is NOT part of this stack. Production runs its own Postgres — a host
# service or a container belonging to another project — and both services here
# connect out to it via POSTGRES_HOST. Bundling one would mean a second, empty
# database on the same box fighting the real one for port 5432.
# `docker-compose.yml`, with its bundled `postgres` service, is local-dev only.
#
# Usage: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# The explicit project name matters: compose otherwise derives it from the
# directory, making this stack share `be` with docker-compose.yml. The deploy
# action passes --remove-orphans, which would then treat a locally running
# 4mica-be-postgres as an orphan of this file and delete it.
name: 4mica-be-prod

# Anchor so `migrate` and `be` cannot drift apart: they must agree on the
# database exactly, or migrations land somewhere the API never reads.
#
# POSTGRES_HOST is resolved from *inside* the container, so it is never
# `localhost`. Two values make sense in production:
#   - `host.docker.internal` — Postgres runs on the host. The extra_hosts entry
#     below is what makes that name resolve on Linux; the host must also listen
#     on the Docker bridge and allow that subnet in pg_hba.conf.
#   - a container name/alias on the `4mica-data` network — Postgres runs in
#     another compose project. Attach that container to 4mica-data.
x-database-url: &database-url
  DATABASE_URL: postgresql://${POSTGRES_USER:-4mica}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-4mica}?schema=public

services:
  migrate:
    build:
      context: ../..
      dockerfile: apps/be/Dockerfile
      target: migrator
    image: 4mica-be-migrate:latest
    container_name: 4mica-be-migrate
    restart: "no"
    environment: *database-url
    # Makes `host.docker.internal` resolve to the host on Linux, where Docker
    # does not provide it by default.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - data

  # Backs the onboarding drip's scheduler only. Sequence state lives in
  # Postgres, so losing this volume costs nothing but the next tick's schedule,
  # which is re-upserted at boot.
  #
  # On `default` alone: `4mica-internal` exists to keep apps/email reachable by
  # apps/be, and `4mica-data` is shared with the playground — neither has any
  # business reaching Redis.
  redis:
    image: redis:8-alpine
    container_name: 4mica-be-redis
    restart: unless-stopped
    stop_grace_period: 10s
    # `noeviction` is mandatory: BullMQ keeps live job state in ordinary keys,
    # so an LRU policy would silently evict them and the drip would stop with
    # nothing in the logs.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    # Published to loopback for operator `redis-cli` only. `be` reaches it by
    # compose service name on the shared `default` network, not through this.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - default

  be:
    build:
      context: ../..
      dockerfile: apps/be/Dockerfile
    image: 4mica-be:latest
    container_name: 4mica-be
    restart: unless-stopped
    init: true
    # Must exceed SHUTDOWN_TIMEOUT_MS so the app always force-exits itself
    # before Docker resorts to SIGKILL.
    stop_grace_period: 40s
    environment:
      # Same anchor as `migrate`, so the API can never read a different
      # database than the one the migrations were applied to.
      <<: *database-url
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-5000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-20000}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_IP_MAX: ${RATE_LIMIT_IP_MAX:-300}
      RATE_LIMIT_USER_MAX: ${RATE_LIMIT_USER_MAX:-120}
      RATE_LIMIT_SENSITIVE_MAX: ${RATE_LIMIT_SENSITIVE_MAX:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
      EMAIL_SERVICE_URL: ${EMAIL_SERVICE_URL:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      APP_URL: ${APP_URL:-}
      # The onboarding drip. It stays off unless BOTH REDIS_URL and
      # UNSUBSCRIBE_SECRET are set, so an incomplete rollout sends nothing.
      #
      # ONBOARDING_DRIP_EPOCH is the kill switch: users created before it are
      # never enrolled, so setting it to a future date arms the stack without
      # sending anything.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:-}
      ONBOARDING_TICK_MS: ${ONBOARDING_TICK_MS:-300000}
      ONBOARDING_BATCH_SIZE: ${ONBOARDING_BATCH_SIZE:-25}
      ONBOARDING_STEP_GAP_MS: ${ONBOARDING_STEP_GAP_MS:-259200000}
      ONBOARDING_DRIP_EPOCH: ${ONBOARDING_DRIP_EPOCH:-2026-09-15T00:00:00.000Z}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BE_PORT:-4000}:4000"
    networks:
      - default
      - internal
      - data
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  redis-data:
    name: 4mica-be-prod-redis-data

networks:
  internal:
    name: 4mica-internal
    external: true
  # The database network, joining `be`, `migrate` and `playground` to Postgres.
  # When POSTGRES_HOST names a container, the deploy workflows' pre_up attaches
  # it here, so the traffic stays on a private bridge rather than hairpinning
  # out through the host's published port. Inert when Postgres is a host
  # service, which the containers reach via host.docker.internal instead.
  #
  # Deliberately NOT 4mica-internal: that one is what keeps apps/email reachable
  # by apps/be alone, and putting the playground on it would hand it access to
  # the email service too.
  #
  # Created out of band (`docker network create 4mica-data`) because any stack
  # may come up first.
  data:
    name: 4mica-data
    external: true
