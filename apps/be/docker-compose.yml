services:
  postgres:
    image: postgres:17-alpine
    container_name: 4mica-be-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-4mica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-4mica}
      POSTGRES_DB: ${POSTGRES_DB:-4mica}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-4mica} -d ${POSTGRES_DB:-4mica}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
    name: 4mica-be-postgres-data
