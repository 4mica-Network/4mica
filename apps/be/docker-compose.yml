services:
  postgres:
    image: postgres:17-alpine
    container_name: 4mica-be-postgres
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-4mica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-4mica}
      POSTGRES_DB: ${POSTGRES_DB:-4mica}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-4mica} -d ${POSTGRES_DB:-4mica}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: 4mica-be-redis
    restart: unless-stopped
    stop_grace_period: 10s
    # `noeviction` is mandatory rather than a tuning choice: BullMQ keeps job
    # and scheduler state in ordinary keys, so an LRU policy would silently
    # evict live jobs and the drip would just stop, with nothing in the logs.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  migrate:
    build:
      context: ../..
      dockerfile: apps/be/Dockerfile
      target: migrator
    image: 4mica-be-migrate:latest
    container_name: 4mica-be-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-4mica}:${POSTGRES_PASSWORD:-4mica}@postgres:5432/${POSTGRES_DB:-4mica}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  be:
    build:
      context: ../..
      dockerfile: apps/be/Dockerfile
    image: 4mica-be:latest
    container_name: 4mica-be
    restart: unless-stopped
    init: true
    # Must exceed SHUTDOWN_TIMEOUT_MS so the app always force-exits itself
    # before Docker resorts to SIGKILL.
    stop_grace_period: 40s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-5000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-20000}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_IP_MAX: ${RATE_LIMIT_IP_MAX:-300}
      RATE_LIMIT_USER_MAX: ${RATE_LIMIT_USER_MAX:-120}
      RATE_LIMIT_SENSITIVE_MAX: ${RATE_LIMIT_SENSITIVE_MAX:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-4mica}:${POSTGRES_PASSWORD:-4mica}@postgres:5432/${POSTGRES_DB:-4mica}?schema=public
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      APP_URL: ${APP_URL:-}
      EMAIL_SERVICE_URL: ${EMAIL_SERVICE_URL:-}
      # The onboarding drip. It stays off unless BOTH of these are set — see
      # src/jobs/onboarding/index.ts.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:-}
      ONBOARDING_TICK_MS: ${ONBOARDING_TICK_MS:-300000}
      ONBOARDING_BATCH_SIZE: ${ONBOARDING_BATCH_SIZE:-25}
      ONBOARDING_STEP_GAP_MS: ${ONBOARDING_STEP_GAP_MS:-259200000}
      ONBOARDING_DRIP_EPOCH: ${ONBOARDING_DRIP_EPOCH:-2026-09-15T00:00:00.000Z}
    ports:
      - "127.0.0.1:${BE_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
    name: 4mica-be-postgres-data
  redis-data:
    name: 4mica-be-redis-data
