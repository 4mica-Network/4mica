services:
  email:
    build:
      context: ../..
      dockerfile: apps/email/Dockerfile
    image: 4mica-email:latest
    container_name: 4mica-email
    restart: unless-stopped
    init: true
    # Must exceed SHUTDOWN_TIMEOUT_MS so the app always force-exits itself
    # before Docker resorts to SIGKILL.
    stop_grace_period: 40s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4100
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_DRY_RUN: ${EMAIL_DRY_RUN:-false}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-4Mica}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@4mica.io}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-support@4mica.io}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://4mica.io}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.4mica.io}
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-5000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-20000}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_IP_MAX: ${RATE_LIMIT_IP_MAX:-300}
    # The service has no authentication of its own: reaching it is the
    # authorisation. Default to loopback and let co-located services reach it
    # over the compose network. When it runs on its own host, set
    # EMAIL_BIND_ADDR to that host's PRIVATE-network address — never 0.0.0.0.
    ports:
      - "${EMAIL_BIND_ADDR:-127.0.0.1}:${EMAIL_PORT:-4100}:4100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
