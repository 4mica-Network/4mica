<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>4Mica Dashboard</title>
    <meta
      name="description"
      content="Manage payments, wallets, customers, agents and APIs on 4Mica."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="4Mica" />
    <meta property="og:title" content="4Mica Dashboard" />
    <meta
      property="og:description"
      content="Manage payments, wallets, customers, agents and APIs on 4Mica."
    />
    <meta name="twitter:card" content="summary" />
    <script src="/theme-init.js"></script>
    <script src="/browser-check.js" defer></script>
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        opacity: 0;
        animation: boot-in 0.2s 0.4s forwards;
      }
      .boot::after {
        content: "";
        width: 1.5rem;
        height: 1.5rem;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        opacity: 0.6;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(1turn);
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <main style="max-width: 28rem; margin: 15vh auto; padding: 0 1.5rem; font-family: system-ui, sans-serif">
        <h1 style="font-size: 1.25rem">JavaScript is turned off</h1>
        <p>The 4Mica dashboard needs JavaScript. Turn it on, then reload this page.</p>
      </main>
    </noscript>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading the dashboard"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
