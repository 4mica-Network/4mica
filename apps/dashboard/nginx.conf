#
# Static host for the dashboard SPA (Vite build output).
#
# react-router-dom owns routing client-side, so every unknown path must return
# index.html rather than 404 — otherwise a hard refresh on /agents breaks.
#

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_proxied any;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/manifest+json
  image/svg+xml;

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  # Compose healthcheck target. Kept ahead of the SPA fallback so it can never
  # be answered with index.html.
  location = /healthz {
    access_log off;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Vite emits content-hashed filenames here, so these are safe to pin. Set the
  # header directly rather than via `expires`, which would emit a second,
  # conflicting Cache-Control of its own.
  location ^~ /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The entry document is revalidated on every visit, or a redeploy keeps
  # serving the old bundle references.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location ~ ^/(theme-init|browser-check)\.js$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    types { }
    default_type application/manifest+json;
  }

  location ~ \.[A-Za-z0-9]+$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
