services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    image: 4mica-web:latest
    container_name: 4mica-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:3000"
    networks:
      - default
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Owns the 4mica.io root namespace: apps/web keeps its known routes and
  # apps/playground takes everything else as a bare handle. It lives here, with
  # apps/web, because this is the box 4mica.io resolves to — the host nginx
  # sends the whole domain to EDGE_PORT and does no path routing of its own.
  edge:
    image: nginx:1.27-alpine
    container_name: 4mica-edge
    restart: unless-stopped
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      # apps/web is local, so a compose service name over 4mica-edge.
      MICA_WEB_UPSTREAM: http://web:3000
      # apps/playground runs on the apps/be box, so this is an address reachable
      # across the network, e.g. http://10.0.0.5:8081. Required: a blank value
      # would make nginx fail to start with an unhelpful parse error, and there
      # is no sane default for another machine's address.
      MICA_PLAYGROUND_UPSTREAM: ${PLAYGROUND_UPSTREAM:?PLAYGROUND_UPSTREAM is required — the address apps/playground is reachable at from this box}
      # Restricts envsubst to our own names. Without it every nginx variable in
      # the template ($host, $connection_upgrade, …) is replaced with an empty
      # string and the config silently stops working.
      NGINX_ENVSUBST_FILTER: "^MICA_"
    ports:
      - "127.0.0.1:${EDGE_PORT:-8088}:80"
    networks:
      - default
      - edge
    depends_on:
      web:
        condition: service_healthy

networks:
  # Joins `web` and `edge`. Created out of band
  # (`docker network create 4mica-edge`) because the deploy action brings this
  # stack up with an external network it does not manage.
  edge:
    name: 4mica-edge
    external: true
