<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Request flow: call, authorize, record, settle">
  <defs>
    <radialGradient id="spotFlow" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="linkFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="#000000" />
  <rect width="1200" height="420" fill="url(#spotFlow)" />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="60" y="60" fill="#ffffff" fill-opacity="0.45" font-size="16" letter-spacing="4">REQUEST FLOW</text>

    <g text-anchor="middle">
      <rect x="60" y="140" width="220" height="120" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.14" />
      <text x="170" y="195" fill="#ffffff" fill-opacity="0.82" font-size="22" font-weight="600">1. Call</text>
      <text x="170" y="225" fill="#ffffff" fill-opacity="0.45" font-size="16">agent hits the API</text>

      <rect x="360" y="140" width="220" height="120" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.14" />
      <text x="470" y="195" fill="#ffffff" fill-opacity="0.82" font-size="22" font-weight="600">2. Authorize</text>
      <text x="470" y="225" fill="#ffffff" fill-opacity="0.45" font-size="16">limit checked</text>

      <rect x="660" y="140" width="220" height="120" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.14" />
      <text x="770" y="195" fill="#ffffff" fill-opacity="0.82" font-size="22" font-weight="600">3. Record</text>
      <text x="770" y="225" fill="#ffffff" fill-opacity="0.45" font-size="16">charge on the tab</text>

      <rect x="960" y="140" width="180" height="120" rx="10" fill="#101010" stroke="#ffffff" stroke-opacity="0.45" />
      <text x="1050" y="195" fill="#ffffff" font-size="22" font-weight="600">4. Settle</text>
      <text x="1050" y="225" fill="#ffffff" fill-opacity="0.55" font-size="16">netted on-chain</text>
    </g>

    <path d="M280 200h80M580 200h80M880 200h80" stroke="url(#linkFlow)" stroke-width="2" />
    <text x="60" y="330" fill="#ffffff" fill-opacity="0.32" font-size="15">Steps 1–3 stay off-chain and complete in one round trip.</text>
  </g>
</svg>
