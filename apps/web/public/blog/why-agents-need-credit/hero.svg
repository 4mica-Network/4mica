<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Many prefunded balances versus one credit line">
  <defs>
    <radialGradient id="spotCredit" cx="72%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="ruleCredit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <pattern id="gridCredit" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="#000000" />
  <rect width="1200" height="600" fill="url(#gridCredit)" />
  <rect width="1200" height="600" fill="url(#spotCredit)" />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="90" y="120" fill="#ffffff" fill-opacity="0.4" font-size="17" letter-spacing="4">PREFUNDING</text>
    <g fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.12">
      <rect x="90" y="150" width="90" height="90" rx="8" />
      <rect x="200" y="150" width="90" height="90" rx="8" />
      <rect x="310" y="150" width="90" height="90" rx="8" />
      <rect x="420" y="150" width="90" height="90" rx="8" />
      <rect x="90" y="260" width="90" height="90" rx="8" />
      <rect x="200" y="260" width="90" height="90" rx="8" />
      <rect x="310" y="260" width="90" height="90" rx="8" />
      <rect x="420" y="260" width="90" height="90" rx="8" />
    </g>
    <g fill="#ffffff" fill-opacity="0.16">
      <rect x="98" y="210" width="74" height="22" rx="4" />
      <rect x="208" y="198" width="74" height="34" rx="4" />
      <rect x="318" y="220" width="74" height="12" rx="4" />
      <rect x="428" y="204" width="74" height="28" rx="4" />
      <rect x="98" y="316" width="74" height="26" rx="4" />
      <rect x="208" y="326" width="74" height="16" rx="4" />
      <rect x="318" y="308" width="74" height="34" rx="4" />
      <rect x="428" y="320" width="74" height="22" rx="4" />
    </g>
    <text x="90" y="400" fill="#ffffff" fill-opacity="0.32" font-size="16">Capital split across every counterparty, mostly idle.</text>

    <path d="M600 150v260" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

    <text x="690" y="120" fill="#ffffff" fill-opacity="0.4" font-size="17" letter-spacing="4">CREDIT</text>
    <rect x="690" y="150" width="420" height="200" rx="10" fill="#101010" stroke="#ffffff" stroke-opacity="0.45" />
    <rect x="714" y="286" width="372" height="40" rx="6" fill="url(#fill)" />
    <text x="714" y="216" fill="#ffffff" font-size="26" font-weight="600">One line</text>
    <text x="714" y="252" fill="#ffffff" fill-opacity="0.55" font-size="18">backs the payer, not each service</text>
    <text x="690" y="400" fill="#ffffff" fill-opacity="0.32" font-size="16">Adding a counterparty costs nothing up front.</text>

    <rect x="90" y="470" width="160" height="3" rx="1.5" fill="url(#ruleCredit)" />
  </g>
</svg>
