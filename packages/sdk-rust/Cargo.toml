[package]
name = "sdk-4mica"
version = "2.0.0-alpha.4"
edition = "2024"
authors = ["4Mica Network <engineering@4mica.io>"]
description = "Official Rust SDK for interacting with the 4Mica payment network."
license = "CC-BY-NC-4.0"
repository = "https://github.com/4mica-Network/4mica"
homepage = "https://4mica.io"
readme = "README.md"
keywords = ["4mica", "payments", "blockchain", "sdk", "ethereum"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

# No parent Cargo workspace exists in this repo; this table keeps the crate
# standalone so cargo can load it as a git dependency.
[workspace]

[dependencies]
rpc = { version = "2.0.0-alpha.3", package = "rpc-4mica" }
crypto = { version = "2.0.0-alpha.3", package = "crypto-4mica" }
log = "0.4.29"
thiserror = "2.0.18"
anyhow = "1.0.102"
async-trait = "0.1.86"
url = { version = "2.5.8", features = ["serde"] }
alloy = "2.0.4"
rand = "0.10.1"
reqwest = { version = "0.13.2", default-features = false, features = [
    "charset",
    "http2",
    "system-proxy",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
base64 = "0.22"
tokio = { version = "1.52.0", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
zeroize = "1.8.2"
cdp-sdk = { version = "0.6.0", optional = true, default-features = false, features = [
    "rustls-tls",
] }
reqwest-middleware = { version = "0.4.2", optional = true, default-features = false, features = [
    "json",
] }
reqwest-012 = { package = "reqwest", version = "0.12.4", optional = true, default-features = false, features = [
    "json",
    "rustls-tls",
] }

[features]
cdp = ["dep:cdp-sdk", "dep:reqwest-middleware", "dep:reqwest-012"]

# The live-stack, DB-coupled e2e tests (and the `core-service`/`entities` deps
# they need) live in 4mica-core's `integration-tests` crate so this crate
# stays portable and free of path dependencies. Run them from 4mica-core with
# `make test-sdk`; they self-skip unless SDK_LOCAL_E2E=1. What remains here are
# offline tests that only exercise the SDK's own surface against mock servers.
[dev-dependencies]
tokio = "1.52.0"
chrono = "0.4.44"
serial_test = { version = "3.2.0", features = ["file_locks"] }
axum = { version = "0.8.8", features = ["macros", "json"] }
