[package]
name = "sdk-4mica"
version = "2.0.0"
edition.workspace = true
authors.workspace = true
description = "Official Rust SDK for interacting with the 4Mica payment network."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["4mica", "payments", "blockchain", "sdk", "ethereum"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[dependencies]
rpc = { workspace = true }
crypto = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
url = { workspace = true }
alloy = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["charset", "http2", "system-proxy"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
zeroize = { workspace = true }
cdp-sdk = { version = "0.6.0", optional = true, default-features = false, features = [
    "rustls-tls",
] }
reqwest-middleware = { version = "0.4.2", optional = true, default-features = false, features = [
    "json",
] }
reqwest-012 = { package = "reqwest", version = "0.12.4", optional = true, default-features = false, features = [
    "json",
    "rustls-tls",
] }

[features]
cdp = ["dep:cdp-sdk", "dep:reqwest-middleware", "dep:reqwest-012"]

# The live-stack, DB-coupled e2e tests (and the `core-service`/`entities` deps
# they need) live in 4mica-core's `integration-tests` crate so this crate
# stays portable and free of path dependencies. Run them from 4mica-core with
# `make test-sdk`; they self-skip unless SDK_LOCAL_E2E=1. What remains here are
# offline tests that only exercise the SDK's own surface against mock servers.
[dev-dependencies]
tokio = { workspace = true }
chrono = { workspace = true }
serial_test = { workspace = true }
axum = { workspace = true, features = ["macros", "json"] }
