#
# app.4mica.io — the dashboard (apps/dashboard).
#
# A Vite SPA served by nginx inside the container, which already handles the
# history fallback, /healthz and the asset cache headers. This block is a plain
# pass-through.
#
# certbot --nginx rewrites this file in place to add the TLS server block and
# the :80 redirect.
#

server {
  listen 80;
  listen [::]:80;
  server_name app.4mica.io;

  # Avatar and logo uploads.
  client_max_body_size 10m;

  location / {
    proxy_pass http://127.0.0.1:8082;

    proxy_http_version 1.1;
    # Clerk validates its authorized parties against the request host, so this
    # must stay the public name and not the upstream address.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;
  }
}
