#
# 4mica.io — the marketing site and the bare-handle namespace.
#
# This block deliberately does NO path routing. Everything goes to the
# `4mica-edge` container (apps/web/docker-compose.yml), whose
# apps/web/nginx.conf.template owns the split between apps/web and
# apps/playground and is kept in sync with `reservedSegments` by a
# build-failing test. Adding location rules here would create a second copy of
# that list to keep in step.
#
# So this file belongs on the box that serves 4mica.io — apps/web's. The
# playground runs beside apps/be and `edge` reaches it over the network via
# PLAYGROUND_UPSTREAM.
#
# certbot --nginx rewrites this file in place to add the TLS server block and
# the :80 redirect.
#

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name 4mica.io www.4mica.io;

  # Profile avatars and OG images; the rest of the traffic is HTML.
  client_max_body_size 10m;

  location / {
    proxy_pass http://127.0.0.1:8088;

    proxy_http_version 1.1;
    # Load-bearing. @4mica/url builds absolute URLs from the request host and
    # Clerk validates authorized parties against it, so the real hostname has
    # to survive both proxy hops.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_read_timeout 60s;
  }
}
