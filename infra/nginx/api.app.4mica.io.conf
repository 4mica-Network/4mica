#
# api.app.4mica.io — the Fastify API (apps/be).
#
# Called cross-origin by the dashboard on app.4mica.io, so `CORS_ORIGINS` in
# apps/be/.env must list https://app.4mica.io. CORS headers come from
# @fastify/cors on the app itself — do not add `add_header` rules here, or
# preflights end up with duplicated headers and browsers reject them.
#
# certbot --nginx rewrites this file in place to add the TLS server block and
# the :80 redirect.
#

server {
  listen 80;
  listen [::]:80;
  server_name api.app.4mica.io;

  client_max_body_size 10m;

  location / {
    proxy_pass http://127.0.0.1:4000;

    proxy_http_version 1.1;
    # Clerk validates its authorized parties against the request host.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # apps/be drains for SHUTDOWN_DRAIN_MS on SIGTERM and answers new requests
    # with 503 + Retry-After during a deploy. Keep the read timeout above the
    # drain window so an in-flight request is not cut off by this layer first.
    proxy_read_timeout 60s;
  }
}
