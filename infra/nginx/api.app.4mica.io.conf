#
# api.app.4mica.io — the Fastify API (apps/be).
#
# Called cross-origin by the dashboard on app.4mica.io, so `CORS_ORIGINS` in
# apps/be/.env must list https://app.4mica.io. CORS headers come from
# @fastify/cors on the app itself — do not add `add_header` rules here, or
# preflights end up with duplicated headers and browsers reject them.
#
# certbot --nginx rewrites this file in place to add the TLS server block and
# the :80 redirect.
#

# A coarse flood guard, keyed on the real peer address. The app's own limits
# (per IP, per user, per API key) are finer; this only stops a burst from
# reaching Node at all. Site files are included in nginx's `http` context,
# which is where a zone has to be declared.
limit_req_zone $binary_remote_addr zone=api_app_per_ip:10m rate=20r/s;

server {
  listen 80;
  listen [::]:80;
  server_name api.app.4mica.io;

  server_tokens off;

  # apps/be caps bodies at 1 MB itself; anything past 2m is never legitimate.
  client_max_body_size 2m;

  location / {
    limit_req zone=api_app_per_ip burst=40 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:4000;

    proxy_http_version 1.1;
    # Clerk validates its authorized parties against the request host.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Appends the peer address. apps/be trusts exactly one hop
    # (TRUST_PROXY_HOPS=1), so it reads this last entry and ignores whatever
    # the client put in front of it — keep the two in step.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # apps/be drains for SHUTDOWN_DRAIN_MS on SIGTERM and answers new requests
    # with 503 + Retry-After during a deploy. Keep the read timeout above the
    # drain window so an in-flight request is not cut off by this layer first.
    proxy_read_timeout 60s;
  }
}
