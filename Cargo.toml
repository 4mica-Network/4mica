[workspace]
resolver = "3"
members = ["packages/sdk-rust"]

# The facilitator pins the 2.0.0-alpha.3 crates, which can't share one lockfile with the SDK's
# alpha.4. It joins once it moves to the current SDK.
exclude = ["apps/facilitator"]

[workspace.package]
edition = "2024"
authors = ["4Mica Network <engineering@4mica.io>"]
license = "CC-BY-NC-4.0"
repository = "https://github.com/4mica-Network/4mica"
homepage = "https://4mica.io"

[workspace.dependencies]
rpc = { version = "=2.0.0-alpha.4", package = "rpc-4mica" }
crypto = { version = "=2.0.0-alpha.4", package = "crypto-4mica" }
alloy = "2.0.4"
anyhow = "1.0.102"
async-trait = "0.1.86"
base64 = "0.22"
log = "0.4.29"
rand = "0.10.1"
reqwest = { version = "0.13.2", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
thiserror = "2.0.18"
tokio = "1.52.0"
url = { version = "2.5.8", features = ["serde"] }
zeroize = "1.8.2"
axum = "0.8.8"
chrono = "0.4.44"
serial_test = { version = "3.2.0", features = ["file_locks"] }
